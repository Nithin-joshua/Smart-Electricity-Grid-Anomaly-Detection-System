# ==============================================================================
# Mosquitto MQTT Broker Configuration
# Smart Electricity Grid Anomaly Detection System
# ==============================================================================

# --- Listeners ---
# Standard MQTT listener on port 1883 (unencrypted, for internal Docker network).
listener 1883

# WebSocket listener on port 9001 (for Grafana MQTT datasource plugin).
listener 9001
protocol websockets

# --- Authentication ---
# Allow anonymous connections for local development.
# In production, replace with password_file or use an auth plugin.
allow_anonymous true

# --- Persistence ---
# Enable message persistence so retained messages survive broker restarts.
persistence true
persistence_location /mosquitto/data/

# --- Logging ---
# Log to stdout for Docker log collection (docker-compose logs).
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# --- Connection Limits ---
# Max inflight QoS 1/2 messages per client (prevents slow consumers from
# causing broker memory exhaustion).
max_inflight_messages 200
max_queued_messages 5000
